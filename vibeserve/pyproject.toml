[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openhub-mcp"
version = "2.0.0"
description = "OpenHub MCP Server — Agentic tools for the OpenHub developer platform."
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=0.9.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
openhub-mcp = "vibeserve.__main__:main"

[tool.setuptools.packages.find]
include = ["vibeserve", "vibeserve.*"]
